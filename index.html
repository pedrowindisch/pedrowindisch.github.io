<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedro Henrique Windisch</title>

  <style>
    @font-face {
      font-family: "Goudy Bookletter 1911";
      font-style: normal;
      font-weight: 400;
      src: url("https://cdn.jsdelivr.net/fontsource/fonts/goudy-bookletter-1911@latest/latin-400-normal.woff2") format("woff2");
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Goudy Bookletter 1911", serif;
      background: #fff;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 2rem;
      box-sizing: border-box;
    }

    main {
      text-align: center;
    }

    img {
      display: block;
      margin: 0 auto 2.5rem;
      width: 220px;
      height: auto;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    a {
      color: #555;
      text-decoration: none;
      font-size: 1rem;
      line-height: 1.6;
    }

    a:hover {
      color: #000;
    }

    .email {
      margin-top: 1.5rem;
      color: #999;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      img {
        width: 160px;
        margin-bottom: 2rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="images/spitz.jpg" alt="Spitzkopf">
    <nav>
      <a href="https://letterboxd.com/pedrowindisch/">Letterboxd</a>
      <a href="https://www.instagram.com/pedrowindisch">Instagram</a>
      <a href="https://github.com/pedrowindisch/">GitHub</a>
      <a href="https://www.linkedin.com/in/pedrowindisch/">LinkedIn</a>
      <a href="https://www.strava.com/athletes/127655882">Strava</a>
      <a href="https://www.goodreads.com/user/show/118576377-pedro-henrique-windisch">Goodreads</a>
      <a class="email" href="mailto:pedro@windisch.com.br">pedro@windisch.com.br</a>
    </nav>
  </main>
</body>
</html>
